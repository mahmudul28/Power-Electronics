<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DC-DC Converters - Interactive Simulation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-deep: #050505;
            --bg-glow: #0a0f1c;
            --c-gate: #f59e0b;     /* Amber */
            --c-source: #f8fafc;   /* White */
            --c-ind: #00ff66;      /* Neon Green */
            --c-sw: #ff2a5f;       /* Neon Rose/Red */
            --c-dio: #00f0ff;      /* Electric Cyan */
            --c-cap: #a855f7;      /* Purple */
            --c-out: #3b82f6;      /* Blue */
            
            --grid-line: rgba(255, 255, 255, 0.07);
            --glass-bg: rgba(15, 23, 42, 0.6);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background: radial-gradient(circle at top, var(--bg-glow) 0%, var(--bg-deep) 100%);
            color: #f8fafc; 
            min-height: 100vh;
        }

        .mono { font-family: 'JetBrains Mono', monospace; }

        .custom-scrollbar::-webkit-scrollbar { height: 8px; width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; border: 1px solid rgba(255,255,255,0.05); }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.4); }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }

        .dot-grid {
            background-image: radial-gradient(rgba(255, 255, 255, 0.15) 1px, transparent 1px);
            background-size: 20px 20px;
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
            margin: 10px 0;
        }
        input[type=range]:focus { outline: none; }
        
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.5);
        }
        
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 18px;
            width: 18px;
            border-radius: 50%;
            background: #fff;
            margin-top: -6.5px;
            cursor: pointer;
            box-shadow: 0 0 10px currentColor, 0 0 5px rgba(255,255,255,0.8);
            border: 2px solid currentColor;
            transition: transform 0.1s;
        }
        input[type=range]::-webkit-slider-thumb:active { transform: scale(1.2); }
        
        .slider-duty { color: var(--c-gate); }
        .slider-volt { color: var(--c-source); }
        .slider-zoom { color: var(--c-cap); }
        
        .active-btn {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(168, 85, 247, 0.2));
            border-color: #a855f7;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.3), inset 0 0 10px rgba(99, 102, 241, 0.2);
            color: #fff;
        }
    </style>
</head>
<body class="p-4 md:p-8 flex flex-col items-center">

    <div class="w-full max-w-[1400px] flex flex-col gap-6">
        
        <!-- Header Section -->
        <div class="glass-panel rounded-2xl p-6 flex flex-col md:flex-row justify-between items-center gap-6 relative overflow-hidden">
            <div class="absolute inset-0 bg-gradient-to-r from-transparent via-white/5 to-transparent -translate-x-full animate-[shimmer_3s_infinite]"></div>
            
            <div>
                <h1 class="text-3xl font-bold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-emerald-400 via-cyan-400 to-blue-400">
                    DC-DC Converters
                </h1>
                <p class="text-slate-400 text-sm mt-1 font-medium tracking-wide">CCM Steady-State Waveform Analysis</p>
            </div>
            
            <div class="glass-panel px-6 py-4 rounded-xl w-full md:w-72 border-white/5">
                <div class="flex justify-between items-center mb-3">
                    <span class="text-[10px] font-bold text-slate-400 tracking-widest uppercase flex items-center gap-2">
                        <svg class="w-3 h-3 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v3m0 0v3m0-3h3m-3 0H7"></path></svg>
                        Oscilloscope Zoom
                    </span>
                    <span class="mono text-purple-400 font-bold text-sm bg-purple-500/10 px-2 py-1 rounded-md" id="zoom-label">100%</span>
                </div>
                <input type="range" id="zoom-slider" min="50" max="250" step="10" value="100" class="slider-zoom">
            </div>
        </div>

        <!-- Controls Row -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- Topology Selector (1/3 Width) -->
            <div class="glass-panel rounded-2xl p-5">
                <label class="flex items-center gap-2 text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-4">
                    <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                    Circuit Topology
                </label>
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-1 gap-2" id="mode-container">
                    <!-- Buttons injected via JS -->
                </div>
            </div>

            <!-- Parameters (2/3 Width) -->
            <div class="glass-panel rounded-2xl p-5 lg:col-span-2 flex flex-col justify-center">
                <div class="flex justify-between items-center mb-6">
                    <label class="flex items-center gap-2 text-[10px] font-bold text-slate-400 uppercase tracking-widest">
                        <svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path></svg>
                        Operational Parameters
                    </label>
                    <div class="flex items-center gap-3">
                        <span class="text-xs font-bold text-slate-500 uppercase tracking-wider">Computed V<sub class="text-[9px]">out</sub> :</span>
                        <span class="mono text-cyan-400 font-bold bg-cyan-500/10 px-3 py-1 rounded-md text-lg" id="val-vout">0.0 V</span>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- Duty Cycle -->
                    <div class="bg-black/20 p-4 rounded-xl border border-amber-500/20 shadow-[inset_0_0_20px_rgba(245,158,11,0.05)]">
                        <div class="flex justify-between mb-3">
                            <span class="text-xs font-bold text-amber-500 uppercase tracking-wider">Duty Cycle (D)</span>
                            <span class="mono text-amber-500 font-bold bg-amber-500/10 px-2 py-0.5 rounded" id="val-duty">50%</span>
                        </div>
                        <input type="range" id="slider-duty" min="10" max="90" step="1" value="50" class="slider-duty">
                    </div>

                    <!-- Input Voltage -->
                    <div class="bg-black/20 p-4 rounded-xl border border-slate-400/20 shadow-[inset_0_0_20px_rgba(255,255,255,0.05)]">
                        <div class="flex justify-between mb-3">
                            <span class="text-xs font-bold text-slate-300 uppercase tracking-wider">Input Voltage (V<sub class="text-[9px]">d</sub>)</span>
                            <span class="mono text-slate-300 font-bold bg-slate-500/10 px-2 py-0.5 rounded" id="val-volt">100 V</span>
                        </div>
                        <input type="range" id="slider-volt" min="10" max="150" step="5" value="100" class="slider-volt">
                    </div>
                </div>
                <div id="stat-strip" class="mt-5 pt-4 border-t border-white/5"></div>
            </div>
        </div>

        <!-- Component & Loss Parameters -->
        <div class="glass-panel rounded-2xl p-5">
            <div class="flex items-center justify-between mb-4">
                <label class="flex items-center gap-2 text-[10px] font-bold text-slate-400 uppercase tracking-widest">
                    <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 3.104v5.714a2.25 2.25 0 01-.659 1.591L5 14.5M9.75 3.104c-.251.023-.501.05-.75.082m.75-.082a24.301 24.301 0 014.5 0m0 0v5.714c0 .597.237 1.17.659 1.591L19.8 15.3M14.25 3.104c.251.023.501.05.75.082M19.8 15.3l-1.57.393A9.065 9.065 0 0112 15a9.065 9.065 0 00-6.23-.693L5 14.5m14.8.8l1.402 1.402c1.232 1.232.65 3.318-1.067 3.611A48.309 48.309 0 0112 21c-2.773 0-5.491-.235-8.135-.687-1.718-.293-2.3-2.379-1.067-3.61L5 14.5"></path></svg>
                    Component &amp; Loss Parameters
                </label>
                <span id="ccm-badge" class="mono text-[10px] font-bold px-2.5 py-1 rounded-full border">CCM</span>
            </div>

            <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4">
                <div class="bg-black/20 p-3 rounded-xl border border-emerald-500/20">
                    <div class="flex justify-between mb-2">
                        <span class="text-[10px] font-bold text-emerald-400 uppercase tracking-wider">Inductance (L)</span>
                        <span class="mono text-emerald-400 font-bold text-[11px]" id="val-L">1000 µH</span>
                    </div>
                    <input type="range" id="slider-L" min="100" max="5000" step="50" value="1000" class="slider-zoom" style="color:#00ff66;">
                </div>
                <div class="bg-black/20 p-3 rounded-xl border border-purple-500/20">
                    <div class="flex justify-between mb-2">
                        <span class="text-[10px] font-bold text-purple-400 uppercase tracking-wider">Capacitance (C)</span>
                        <span class="mono text-purple-400 font-bold text-[11px]" id="val-C">100 µF</span>
                    </div>
                    <input type="range" id="slider-C" min="10" max="1000" step="10" value="100" class="slider-zoom" style="color:#a855f7;">
                </div>
                <div class="bg-black/20 p-3 rounded-xl border border-blue-500/20">
                    <div class="flex justify-between mb-2">
                        <span class="text-[10px] font-bold text-blue-400 uppercase tracking-wider">Switch Freq (f<sub>sw</sub>)</span>
                        <span class="mono text-blue-400 font-bold text-[11px]" id="val-fsw">20 kHz</span>
                    </div>
                    <input type="range" id="slider-fsw" min="5" max="100" step="5" value="20" class="slider-zoom" style="color:#3b82f6;">
                </div>
                <div class="bg-black/20 p-3 rounded-xl border border-slate-400/20">
                    <div class="flex justify-between mb-2">
                        <span class="text-[10px] font-bold text-slate-300 uppercase tracking-wider">Load (R)</span>
                        <span class="mono text-slate-300 font-bold text-[11px]" id="val-R">30 Ω</span>
                    </div>
                    <input type="range" id="slider-R" min="2" max="100" step="1" value="30" class="slider-zoom" style="color:#f8fafc;">
                </div>
                <div class="bg-black/20 p-3 rounded-xl border border-rose-500/20">
                    <div class="flex justify-between mb-2">
                        <span class="text-[10px] font-bold text-rose-400 uppercase tracking-wider">Switch R<sub>DS(on)</sub></span>
                        <span class="mono text-rose-400 font-bold text-[11px]" id="val-rds">150 mΩ</span>
                    </div>
                    <input type="range" id="slider-rds" min="10" max="500" step="10" value="150" class="slider-zoom" style="color:#ff2a5f;">
                </div>
                <div class="bg-black/20 p-3 rounded-xl border border-cyan-500/20">
                    <div class="flex justify-between mb-2">
                        <span class="text-[10px] font-bold text-cyan-400 uppercase tracking-wider">Diode V<sub>F</sub></span>
                        <span class="mono text-cyan-400 font-bold text-[11px]" id="val-vf">0.7 V</span>
                    </div>
                    <input type="range" id="slider-vf" min="0.2" max="1.5" step="0.1" value="0.7" class="slider-zoom" style="color:#00f0ff;">
                </div>
            </div>
            <p id="dcm-warning" class="hidden mt-4 text-[11px] mono text-amber-400 bg-amber-500/10 border border-amber-500/20 rounded-lg px-3 py-2"></p>
        </div>

        <!-- Full Width Schematic Display -->
        <div class="glass-panel rounded-2xl p-5 flex flex-col w-full">
            <label class="flex items-center gap-2 text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-4">
                <svg class="w-4 h-4 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2zM9 9h6v6H9V9z"></path></svg>
                Circuit Schematic
            </label>
            <div id="circuit-diagram" class="w-full flex justify-center items-center bg-black/40 rounded-xl border border-white/5 p-6 dot-grid min-h-[200px]">
                <!-- Diagram injected via JS -->
            </div>
        </div>

        <!-- Design Analysis: Component Stress & Efficiency -->
        <div class="glass-panel rounded-2xl p-5">
            <label class="flex items-center gap-2 text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-4">
                <svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 013 19.875v-6.75zM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V8.625zM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V4.125z"></path></svg>
                Design Analysis — Component Stress &amp; Efficiency
            </label>
            <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-3" id="stress-grid">
                <!-- Stat cards injected via JS -->
            </div>
        </div>

        <!-- Full Width Waveform Display Area -->
        <div class="glass-panel rounded-2xl p-1 flex-grow overflow-hidden flex flex-col border-t border-t-white/10 relative shadow-[0_0_50px_rgba(0,255,102,0.05)]">
            <div class="absolute inset-0 pointer-events-none bg-[linear-gradient(rgba(18,16,16,0)_50%,rgba(0,0,0,0.1)_50%)] bg-[length:100%_4px] z-10 opacity-30"></div>
            
            <div id="scope-scroll" class="w-full h-full overflow-x-auto p-4 custom-scrollbar text-center relative z-0">
                <div id="svg-wrapper" style="margin: 0 auto; width: 100%; min-width: 800px; transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1), min-width 0.3s; position: relative;" class="flex flex-col gap-2 pb-6">
                    <!-- SVGs injected via JS -->
                </div>
            </div>
            <div id="scope-cursor-line" class="hidden w-px bg-white/50 pointer-events-none z-20" style="position:fixed; box-shadow: 0 0 6px rgba(255,255,255,0.6);"></div>
            <div id="scope-readout" class="hidden mono text-[10px] text-left bg-black/90 border border-white/10 rounded-lg p-3 pointer-events-none shadow-xl z-30" style="position:fixed; min-width: 170px;"></div>
        </div>

        <!-- Footer / Credit -->
        <div class="w-full py-2 flex items-center justify-center">
            <p class="text-slate-600 text-[10px] tracking-[0.15em] uppercase mono">
                Mahmudul Hasan (2202156)
            </p>
        </div>

    </div>

    <script>
        const MODES = [
            { id: 'buck', label: 'Step-Down (Buck) Converter' },
            { id: 'boost', label: 'Step-Up (Boost) Converter' },
            { id: 'buck-boost', label: 'Step-Down/Up (Buck-Boost)' },
            { id: 'cuk', label: 'Cúk Converter' }
        ];

        const state = {
            mode: 'buck',
            duty: 50,
            volt: 100,
            zoom: 100,
            L_uH: 1000,
            C_uF: 100,
            fsw_kHz: 20,
            R: 30,
            rds_mOhm: 150,
            vf: 0.7,
            lastData: null,
            lastMeta: []
        };

        const el = {
            modeContainer: document.getElementById('mode-container'),
            circuitDiagram: document.getElementById('circuit-diagram'),
            zoomSlider: document.getElementById('zoom-slider'),
            zoomLabel: document.getElementById('zoom-label'),
            sliderDuty: document.getElementById('slider-duty'),
            sliderVolt: document.getElementById('slider-volt'),
            sliderL: document.getElementById('slider-L'),
            sliderC: document.getElementById('slider-C'),
            sliderFsw: document.getElementById('slider-fsw'),
            sliderR: document.getElementById('slider-R'),
            sliderRds: document.getElementById('slider-rds'),
            sliderVf: document.getElementById('slider-vf'),
            valL: document.getElementById('val-L'),
            valC: document.getElementById('val-C'),
            valFsw: document.getElementById('val-fsw'),
            valR: document.getElementById('val-R'),
            valRds: document.getElementById('val-rds'),
            valVf: document.getElementById('val-vf'),
            ccmBadge: document.getElementById('ccm-badge'),
            dcmWarning: document.getElementById('dcm-warning'),
            stressGrid: document.getElementById('stress-grid'),
            scopeScroll: document.getElementById('scope-scroll'),
            cursorLine: document.getElementById('scope-cursor-line'),
            readout: document.getElementById('scope-readout'),
            valDuty: document.getElementById('val-duty'),
            valVolt: document.getElementById('val-volt'),
            valVout: document.getElementById('val-vout'),
            wrapper: document.getElementById('svg-wrapper'),
            statStrip: document.getElementById('stat-strip')
        };

        const colors = {
            grid: 'rgba(255, 255, 255, 0.15)',
            text: '#94a3b8',
            wire: '#64748b',
            vd: '#f8fafc',
            vg: '#f59e0b',
            iL: '#00ff66',
            ind: '#00ff66',
            sw: '#ff2a5f',
            dio: '#00f0ff',
            cap: '#a855f7',
            out: '#3b82f6'
        };

        // Shared SVG Definitions for circuit symbols
        const SVG_DEFS = `<svg width="0" height="0" class="hidden">
            <defs>
                <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="2" result="blur" />
                    <feComposite in="SourceGraphic" in2="blur" operator="over" />
                </filter>
                <filter id="glow-intense" filterUnits="userSpaceOnUse" x="-20" y="-40" width="800" height="200">
                    <feGaussianBlur stdDeviation="3.5" result="blur1" />
                    <feGaussianBlur stdDeviation="1" result="blur2" />
                    <feMerge>
                        <feMergeNode in="blur1" />
                        <feMergeNode in="blur2" />
                        <feMergeNode in="SourceGraphic" />
                    </feMerge>
                </filter>
                <!-- BJT/Transistor Switch -->
                <g id="bjt-r">
                    <circle cx="0" cy="0" r="14" fill="rgba(255,42,95,0.1)" stroke="currentColor" stroke-width="1.5"/>
                    <line x1="-14" y1="0" x2="-6" y2="0" stroke="currentColor" stroke-width="2"/>
                    <line x1="-6" y1="-8" x2="-6" y2="8" stroke="currentColor" stroke-width="2"/>
                    <line x1="-6" y1="-4" x2="6" y2="-10" stroke="currentColor" stroke-width="2"/>
                    <line x1="-6" y1="4" x2="6" y2="10" stroke="currentColor" stroke-width="2"/>
                    <polygon points="2,12 8,11 5,6" fill="currentColor"/>
                    <line x1="6" y1="-10" x2="6" y2="-20" stroke="currentColor" stroke-width="2"/>
                    <line x1="6" y1="10" x2="6" y2="20" stroke="currentColor" stroke-width="2"/>
                </g>
                <g id="bjt-u">
                    <circle cx="0" cy="0" r="14" fill="rgba(255,42,95,0.1)" stroke="currentColor" stroke-width="1.5"/>
                    <line x1="0" y1="14" x2="0" y2="6" stroke="currentColor" stroke-width="2"/>
                    <line x1="-8" y1="6" x2="8" y2="6" stroke="currentColor" stroke-width="2"/>
                    <line x1="-4" y1="6" x2="-10" y2="-6" stroke="currentColor" stroke-width="2"/>
                    <line x1="4" y1="6" x2="10" y2="-6" stroke="currentColor" stroke-width="2"/>
                    <polygon points="12,-2 11,-8 6,-5" fill="currentColor"/>
                    <line x1="-10" y1="-6" x2="-20" y2="-6" stroke="currentColor" stroke-width="2"/>
                    <line x1="10" y1="-6" x2="20" y2="-6" stroke="currentColor" stroke-width="2"/>
                </g>
                <!-- Diode -->
                <g id="dio-d">
                    <polygon points="-10,-10 10,-10 0,10" fill="currentColor"/>
                    <line x1="-10" y1="10" x2="10" y2="10" stroke="currentColor" stroke-width="2.5"/>
                    <line x1="0" y1="-20" x2="0" y2="-10" stroke="currentColor" stroke-width="2.5"/>
                    <line x1="0" y1="10" x2="0" y2="20" stroke="currentColor" stroke-width="2.5"/>
                </g>
                <g id="dio-u">
                    <polygon points="-10,10 10,10 0,-10" fill="currentColor"/>
                    <line x1="-10" y1="-10" x2="10" y2="-10" stroke="currentColor" stroke-width="2.5"/>
                    <line x1="0" y1="-20" x2="0" y2="-10" stroke="currentColor" stroke-width="2.5"/>
                    <line x1="0" y1="10" x2="0" y2="20" stroke="currentColor" stroke-width="2.5"/>
                </g>
                <g id="dio-r">

        // Small filled triangle current-direction arrow. dir: 'r','l','u','d'
        const flowArrow = (x, y, dir, color) => {

        // Small italic current-label, e.g. i_L
        const curLabel = (x, y, color, base, s, anchor='middle') =>

        const getCircuitSVG = (mode) => {

            res += `<text x="115" y="122" fill="${colors.vd}" font-size="14" font-weight="bold" opacity="0.85">−</text>`;

            } else if (mode === 'buck-boost') {
                res += `
                    <path d="M 100,82 L 100,50 L 150,50 M 190,50 L 250,50 M 250,50 L 300,50 M 340,50 L 500,50 L 500,80 M 100,118 L 100,150 L 500,150 L 500,120" fill="none" stroke="${wc}" stroke-width="2"/>
                    <path d="M 250,50 L 250,80 M 250,120 L 250,150 M 430,50 L 430,80 M 430,120 L 430,150" fill="none" stroke="${wc}" stroke-width="2"/>
                    <circle cx="250" cy="50" r="4" fill="${wc}"/> <circle cx="250" cy="150" r="4" fill="${wc}"/>

                    ${flowArrow(380, 50, 'l', colors.dio)}${curLabel(380, 42, colors.dio, 'i', 'D')}
                    ${flowArrow(465, 50, 'r', colors.out)}${curLabel(465, 42, colors.out, 'i', 'o')}

                `;
            } else if (mode === 'cuk') {
                res += `
                    <path d="M 100,82 L 100,50 L 150,50 M 190,50 L 250,50 M 290,50 L 350,50 M 390,50 L 500,50 L 500,80 M 100,118 L 100,150 L 500,150 L 500,120" fill="none" stroke="${wc}" stroke-width="2"/>
                    <path d="M 210,50 L 210,80 M 210,120 L 210,150 M 310,50 L 310,80 M 310,120 L 310,150 M 430,50 L 430,80 M 430,120 L 430,150" fill="none" stroke="${wc}" stroke-width="2"/>
                    <circle cx="210" cy="50" r="4" fill="${wc}"/> <circle cx="210" cy="150" r="4" fill="${wc}"/>
                    <circle cx="310" cy="50" r="4" fill="${wc}"/> <circle cx="310" cy="150" r="4" fill="${wc}"/>
                    <circle cx="430" cy="50" r="4" fill="${wc}"/> <circle cx="430" cy="150" r="4" fill="${wc}"/>

                    ${flowArrow(130, 50, 'r', colors.ind)}${curLabel(130, 42, colors.ind, 'i', 'L1')}
                    ${flowArrow(370, 50, 'r', colors.ind)}${curLabel(370, 68, colors.ind, 'i', 'L2')}
                    ${flowArrow(210, 88, 'd', colors.sw)}${curLabel(192, 93, colors.sw, 'i', 'SW')}
                    ${flowArrow(310, 88, 'd', colors.dio)}${curLabel(292, 93, colors.dio, 'i', 'D')}
                    ${flowArrow(465, 50, 'r', colors.out)}${curLabel(465, 42, colors.out, 'i', 'o')}
                    ${flowArrow(430, 88, 'd', colors.cap)}${curLabel(448, 93, colors.cap, 'i', 'C2')}
                `;
            }
            res += `</svg>`;
            return res;
        };

        // titleHtml: rendered as real HTML (proper <sub> typography), sits ABOVE the plot so it can
        // never overlap the waveform. eqHtml: short formula shown top-right of the same header row.
        // The vertical scale auto-fits to THIS signal's own min/max (with padding) instead of a
        // shared global scale, so flat/near-constant or small-ripple signals (Vd, IL, Ic, Vo) are
        // always clearly visible instead of being squashed to a hairline near the panel edge.
        const buildWaveChart = (titleHtml, eqHtml, data, key, color, height=80, fill=false, opts={}) => {
            const vals = data.map(d => d[key]);
            let dMin = Math.min(...vals), dMax = Math.max(...vals);

            let yMin, yMax;
            if (opts.fixedMin !== undefined) {
                // Digital / fixed-scale signal (e.g. gate pulse)
                yMin = opts.fixedMin; yMax = opts.fixedMax;
            } else if (dMax - dMin < 1e-9) {
                // Truly constant (e.g. Vd, Io) -> pad symmetrically so the line sits mid-panel, clearly visible
                const pad = Math.max(Math.abs(dMax) * 0.25, 0.5);
                yMin = dMin - pad; yMax = dMax + pad;
            } else {
                const pad = (dMax - dMin) * 0.2;
                yMin = dMin - pad; yMax = dMax + pad;
            }
            const range = yMax - yMin || 1;

            let svg = `<svg viewBox="0 0 740 ${height}" class="w-full h-auto overflow-visible block text-left" style="min-height: ${height}px;">`;

            // Background Grid (2 Switching Periods: 0 to 720)
            for(let deg = 0; deg <= 720; deg += 45) {
                let dash = (deg % 360 === 0) ? '4 4' : '1 3';
                let opac = (deg % 360 === 0) ? '0.4' : '0.15';
                svg += `<line x1="${deg+10}" y1="0" x2="${deg+10}" y2="${height}" stroke="#ffffff" opacity="${opac}" stroke-dasharray="${dash}" stroke-width="1"/>`;

                if (deg % 360 === 0 && deg > 0) {
                    let label = (deg === 360) ? 'Ts' : '2Ts';
                    svg += `<text x="${deg+14}" y="${height - 4}" fill="#475569" font-size="10" font-family="'JetBrains Mono', monospace">${label}</text>`;
                }
            }

            // Zero Line (only drawn if 0 actually falls within this signal's own scaled range)
            const zeroY = height - ((0 - yMin) / range) * height;
            if (zeroY >= 0 && zeroY <= height) {
                svg += `<line x1="10" y1="${zeroY}" x2="730" y2="${zeroY}" stroke="rgba(255,255,255,0.35)" stroke-width="1" stroke-dasharray="2 2"/>`;
                svg += `<text x="0" y="${zeroY+3}" fill="#94a3b8" font-size="9" font-weight="bold">0</text>`;
            }

            // Y-axis min/max reference labels (right edge), so the reader can see actual scale
            svg += `<text x="734" y="10" fill="${color}" font-size="9" font-weight="700" text-anchor="end" opacity="0.75">${fmtNum(yMax)}</text>`;
            svg += `<text x="734" y="${height-3}" fill="${color}" font-size="9" font-weight="700" text-anchor="end" opacity="0.75">${fmtNum(yMin)}</text>`;

            // Path Generator
            if (!data.length) return { svg: svg + `</svg>`, header: buildChartHeader(titleHtml, eqHtml, color) };

            let d = `M 10 ${height - ((data[0][key] - yMin) / range) * height}`;
            for (let i = 1; i <= 720; i++) {
                const val = data[i][key];
                const y = height - ((val - yMin) / range) * height;
                d += ` L ${i+10} ${y}`;
            }

            if (fill) {
                svg += `<path d="${d} L 730 ${zeroY>=0&&zeroY<=height?zeroY:height} L 10 ${zeroY>=0&&zeroY<=height?zeroY:height} Z" fill="${color}" opacity="0.18"/>`;
            }
            svg += `<path d="${d}" fill="none" stroke="${color}" stroke-width="2.25" filter="url(#glow-intense)"/>`;
            svg += `</svg>`;

            return { svg, header: buildChartHeader(titleHtml, eqHtml, color) };
        };

        const fmtNum = (n) => {
            if (Math.abs(n) >= 100) return n.toFixed(0);
            if (Math.abs(n) >= 10) return n.toFixed(1);
            return n.toFixed(2);
        };

        const buildChartHeader = (titleHtml, eqHtml, color) => `
            <div class="flex justify-between items-center px-3 pt-2.5 pb-1">
                <div class="flex items-center gap-2">
                    <span class="w-1.5 h-1.5 rounded-full shrink-0" style="background:${color}; box-shadow:0 0 6px ${color};"></span>
                    <span class="text-[11.5px] font-bold tracking-wide" style="color:${color};">${titleHtml}</span>
                </div>
                <span class="mono text-[10px] text-slate-400/90 text-right">${eqHtml}</span>
            </div>`;

        const renderChart = (titleHtml, eqHtml, data, key, color, height=80, fill=false, opts={}) => {
            const { svg, header } = buildWaveChart(titleHtml, eqHtml, data, key, color, height, fill, opts);
            return `<div class="border-t border-white/5 first:border-t-0">${header}${svg}</div>`;
        };

        const computeData = () => {
            const arr = [];
            const D = state.duty / 100;
            const Vd = state.volt;
            const T = 360; 
            const ton = D * T;

            // Real component values (converted to SI units)
            const L = state.L_uH * 1e-6;      // H
            const C = state.C_uF * 1e-6;      // F
            const fsw = state.fsw_kHz * 1e3;  // Hz
            const R = state.R;                 // Ω
            const Rds = state.rds_mOhm / 1000; // Ω
            const VF = state.vf;               // V

            const Treal = 1 / fsw;   // s — real switching period (represented by 360 "degree" samples)
            const dt = Treal / T;    // s per sample
            const tonReal = D * Treal;

            let Vo = 0, Io = 0, I_L = 0, I_L1 = 0, I_L2 = 0;
            let dIL = 0, dIL1 = 0, dIL2 = 0;
            let vLon = 0; // inductor voltage during t_on, used for volt-second ripple calc

            if (state.mode === 'buck') {
                Vo = D * Vd;
                Io = Vo / R;
                I_L = Io;
                vLon = Vd - Vo;
                dIL = vLon * tonReal / L; // ΔI_L = V_L(on)·D·T / L
            } else if (state.mode === 'boost') {
                Vo = Vd / (1 - D);
                Io = Vo / R;
                I_L = Io / (1 - D);
                vLon = Vd;
                dIL = vLon * tonReal / L;
            } else if (state.mode === 'buck-boost') {
                Vo = - (Vd * D / (1 - D));
                Io = Math.abs(Vo) / R;
                I_L = Io / (1 - D);
                vLon = Vd;
                dIL = vLon * tonReal / L;
            } else if (state.mode === 'cuk') {
                Vo = - (Vd * D / (1 - D));
                Io = Math.abs(Vo) / R;
                I_L1 = Io * D / (1 - D);
                I_L2 = Io;
                // Both Ćuk inductors see Vd during t_on (coupling cap sits at Vd+|Vo|) — same volt-second law
                dIL1 = Vd * tonReal / L;
                dIL2 = Vd * tonReal / L;
            }

            el.valVout.innerText = Vo.toFixed(1) + ' V';
            if(Vo < 0) el.valVout.classList.replace('text-cyan-400', 'text-pink-400');
            else el.valVout.classList.replace('text-pink-400', 'text-cyan-400');

            // Generate raw waveforms
            let raw_ic = [];
            for (let i = 0; i <= 720; i++) {
                const t = i % T;
                const isON = t < ton;
                const pt = { deg: i, vd: Vd, vg: isON ? 1 : 0 };
                
                const getTri = (avg, rip) => isON 
                    ? (avg - rip/2) + rip * (t / ton) 
                    : (avg + rip/2) - rip * ((t - ton) / (T - ton));

                if (state.mode === 'buck') {
                    pt.iL = getTri(I_L, dIL);
                    pt.ig = isON ? pt.iL : 0;
                    pt.iD = isON ? 0 : pt.iL;
                    pt.vs = isON ? 0 : Vd;
                    pt.vD = isON ? -Vd : 0;
                    pt.io = Io;
                    pt.ic = pt.iL - Io;
                } else if (state.mode === 'boost') {
                    pt.iL = getTri(I_L, dIL);
                    pt.ig = isON ? pt.iL : 0;
                    pt.iD = isON ? 0 : pt.iL;
                    pt.vs = isON ? 0 : Vo;
                    pt.vD = isON ? -Vo : 0;
                    pt.io = Io;
                    pt.ic = isON ? -Io : (pt.iL - Io);
                } else if (state.mode === 'buck-boost') {
                    pt.iL = getTri(I_L, dIL);
                    pt.ig = isON ? pt.iL : 0;
                    pt.iD = isON ? 0 : pt.iL;
                    pt.vs = isON ? 0 : Vd + Math.abs(Vo);
                    pt.vD = isON ? -(Vd + Math.abs(Vo)) : 0;
                    pt.io = Io;
                    pt.ic = isON ? -Io : (pt.iL - Io);
                } else if (state.mode === 'cuk') {
                    pt.iL1 = getTri(I_L1, dIL1);
                    pt.iL2 = getTri(I_L2, dIL2);
                    pt.ig = isON ? (pt.iL1 + pt.iL2) : 0;
                    pt.iD = isON ? 0 : (pt.iL1 + pt.iL2);
                    pt.vs = isON ? 0 : Vd + Math.abs(Vo);
                    pt.vD = isON ? -(Vd + Math.abs(Vo)) : 0;
                    pt.io = Io;
                    pt.ic = pt.iL2 - Io;
                }
                
                raw_ic.push(pt.ic);
                arr.push(pt);
            }

            // Physical integration: Vc(t) = (1/C) ∫ i_C dt — real output-cap voltage ripple, not a visual hack
            let integral = 0;
            let vo_raw = [];
            for(let i=0; i<=720; i++) {
                integral += raw_ic[i] * dt;
                vo_raw.push(integral / C);
            }
            let avg_vo_raw = vo_raw.reduce((a,b)=>a+b, 0) / 721;

            for(let i=0; i<=720; i++) {
                arr[i].vo = Vo + (vo_raw[i] - avg_vo_raw);
            }
            const dVo = Math.max(...vo_raw) - Math.min(...vo_raw);

            // Component stress: RMS / average over one real switching period (samples 0..359)
            const rmsAvg = (key) => {
                let sum = 0, sumSq = 0;
                for (let i = 0; i < T; i++) { sum += arr[i][key]; sumSq += arr[i][key] * arr[i][key]; }
                return { avg: sum / T, rms: Math.sqrt(sumSq / T) };
            };
            const swStat = rmsAvg('ig');
            const dStat = rmsAvg('iD');
            const vBlock = state.mode === 'buck' ? Vd : state.mode === 'boost' ? Vo : (Vd + Math.abs(Vo));

            // CCM / DCM boundary: converter is in CCM only if minimum inductor current stays positive
            const isDCM = state.mode === 'cuk'
                ? (I_L1 - dIL1 / 2 < 0) || (I_L2 - dIL2 / 2 < 0)
                : (I_L - dIL / 2) < 0;

            // Conduction-loss-only efficiency estimate (ignores inductor ESR / capacitor ESR / switching loss)
            const P_out = Math.abs(Vo) * Io;
            const P_sw = swStat.rms * swStat.rms * Rds;
            const P_d = dStat.avg * VF;
            const P_in = P_out + P_sw + P_d;
            const eff = P_in > 0 ? (P_out / P_in) * 100 : 0;

            const stats = {
                D, Vd, T, ton, R, Vo, Io, I_L, I_L1, I_L2, dIL, dIL1, dIL2, dVo,
                L, C, fsw, Treal, isDCM, vBlock, swStat, dStat, P_out, P_sw, P_d, eff
            };
            return { arr, stats };
        };

        const render = () => {
            el.modeContainer.innerHTML = MODES.map(m => `
                <button data-mode="${m.id}" class="w-full text-left px-5 py-3 rounded-xl transition-all duration-300 border ${state.mode === m.id ? 'active-btn font-bold scale-[1.02]' : 'bg-white/5 border-white/5 text-slate-400 hover:bg-white/10 hover:text-white'}">
                    ${m.label}
                </button>
            `).join('');

            document.querySelectorAll('#mode-container button').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    state.mode = e.target.closest('button').dataset.mode;
                    render();
                });
            });

            el.circuitDiagram.innerHTML = getCircuitSVG(state.mode);
            el.valDuty.innerText = state.duty + '%';
            el.valVolt.innerText = state.volt + ' V';

            const { arr: data, stats } = computeData();
            const { D, Vd, Vo, Io, I_L, I_L1, I_L2, dIL, dIL1, dIL2, dVo, isDCM, vBlock, swStat, dStat, eff, P_out, P_sw, P_d, Treal } = stats;
            const m = state.mode;
            let svgs = "";
            const meta = []; // tracks {key,label,color,unit} for every chart, in display order, for the hover cursor

            // sub()/sup() build real HTML subscripts/superscripts so labels render as
            // proper electrical notation (big letter, small subscript) instead of "V_D".
            const sub = (base, s) => `${base}<sub style="font-size:0.62em;">${s}</sub>`;
            const sec = (t) => `<span class="text-slate-500 font-medium">${t}</span>`;
            const addChart = (titleHtml, eqHtml, key, color, height, fill, opts, label, unit) => {
                svgs += renderChart(titleHtml, eqHtml, data, key, color, height, fill, opts);
                meta.push({ key, label, color, unit });
            };

            // Switch / diode blocking-voltage magnitude depends on topology
            const vBlockTxt = m === 'buck' ? `V_d` : m === 'boost' ? `V_o` : `V_d+|V_o|`;

            addChart(
                `Input Voltage ${sec('(' + sub('V','d') + ')')}`,
                `v<sub>d</sub>(t) = V<sub>d</sub> = ${fmtNum(Vd)} V`,
                'vd', colors.vd, 50, false, {}, 'V_d', 'V'
            );
            addChart(
                `Gate Pulse ${sec('(' + sub('v','g') + ')')}`,
                `D = t<sub>on</sub>/T = ${(D*100).toFixed(0)}%`,
                'vg', colors.vg, 46, true, { fixedMin: -0.2, fixedMax: 1.25 }, 'v_g', ''
            );

            if (m === 'cuk') {
                addChart(
                    `Input Inductor ${sec('(' + sub('i','L1') + ')')}`,
                    `I<sub>L1</sub> = I<sub>o</sub>·D/(1−D) = ${fmtNum(I_L1)} A, ΔI = ${fmtNum(dIL1)} A`,
                    'iL1', colors.ind, 62, false, {}, 'i_L1', 'A'
                );
                addChart(
                    `Output Inductor ${sec('(' + sub('i','L2') + ')')}`,
                    `I<sub>L2</sub> = I<sub>o</sub> = ${fmtNum(I_L2)} A, ΔI = ${fmtNum(dIL2)} A`,
                    'iL2', colors.ind, 62, false, {}, 'i_L2', 'A'
                );
            } else {
                const ilExpr = m === 'buck' ? `I<sub>o</sub> = V<sub>o</sub>/R` : `I<sub>o</sub>/(1−D)`;
                addChart(
                    `Inductor Current ${sec('(' + sub('i','L') + ')')}`,
                    `I<sub>L</sub> = ${ilExpr} = ${fmtNum(I_L)} A, ΔI<sub>L</sub> = ${fmtNum(dIL)} A`,
                    'iL', colors.ind, 66, false, {}, 'i_L', 'A'
                );
            }

            addChart(
                `Switch Current ${sec('(' + sub('i','SW') + ')')}`,
                `i<sub>SW</sub> = i<sub>L</sub> (ON), 0 (OFF) &nbsp; I<sub>rms</sub>=${fmtNum(swStat.rms)}A`,
                'ig', colors.sw, 60, true, {}, 'i_SW', 'A'
            );
            addChart(
                `Diode Current ${sec('(' + sub('i','D') + ')')}`,
                `i<sub>D</sub> = i<sub>L</sub> (OFF), 0 (ON) &nbsp; I<sub>avg</sub>=${fmtNum(dStat.avg)}A`,
                'iD', colors.dio, 60, true, {}, 'i_D', 'A'
            );

            addChart(
                `Switch Voltage ${sec('(' + sub('V','SW') + ')')}`,
                `V<sub>SW,off</sub> = ${vBlockTxt} = ${fmtNum(vBlock)} V`,
                'vs', colors.sw, 66, false, {}, 'V_SW', 'V'
            );
            addChart(
                `Diode Voltage ${sec('(' + sub('V','D') + ')')}`,
                `V<sub>D,on</sub> = −(${vBlockTxt}) = ${fmtNum(-vBlock)} V`,
                'vD', colors.dio, 66, false, {}, 'V_D', 'V'
            );

            addChart(
                `Load Current ${sec('(' + sub('I','o') + ')')}`,
                `I<sub>o</sub> = V<sub>o</sub>/R = ${fmtNum(Io)} A`,
                'io', colors.out, 48, false, {}, 'I_o', 'A'
            );
            addChart(
                `Capacitor Current ${sec('(' + sub('i','C') + ')')}`,
                `i<sub>C</sub> = i<sub>L</sub> − I<sub>o</sub> (avg = 0)`,
                'ic', colors.cap, 74, true, {}, 'i_C', 'A'
            );

            let voExpr;
            if (m === 'buck') voExpr = `D·V<sub>d</sub>`;
            else if (m === 'boost') voExpr = `V<sub>d</sub>/(1−D)`;
            else voExpr = `−D·V<sub>d</sub>/(1−D)`;
            addChart(
                `Output Voltage ${sec('(' + sub('V','o') + ')')}`,
                `V<sub>o</sub> = ${voExpr} = ${fmtNum(Vo)} V, ΔV<sub>o</sub> = ${fmtNum(dVo)} V`,
                'vo', colors.out, 74, false, {}, 'V_o', 'V'
            );

            el.wrapper.innerHTML = svgs;
            state.lastData = data;
            state.lastMeta = meta;
            state.lastTreal = Treal;

            // Live summary strip under the parameter panel
            if (el.statStrip) {
                el.statStrip.innerHTML = `
                    <div class="flex flex-wrap gap-x-6 gap-y-1 mono text-[11px] text-slate-400">
                        <span>${sub('I','L')}<span class="text-slate-600">(avg)</span> = <span class="text-emerald-400 font-bold">${fmtNum(I_L||I_L2)} A</span></span>
                        <span>${sub('V','SW')}<span class="text-slate-600">(max)</span> = <span class="text-rose-400 font-bold">${fmtNum(vBlock)} V</span></span>
                        <span>${sub('V','D')}<span class="text-slate-600">(max)</span> = <span class="text-cyan-400 font-bold">${fmtNum(vBlock)} V</span></span>
                        <span>${sub('I','o')} = <span class="text-blue-400 font-bold">${fmtNum(Io)} A</span></span>
                    </div>`;
            }

            // CCM / DCM badge + warning
            el.ccmBadge.className = 'mono text-[10px] font-bold px-2.5 py-1 rounded-full border ' +
                (isDCM ? 'text-amber-400 border-amber-500/40 bg-amber-500/10' : 'text-emerald-400 border-emerald-500/40 bg-emerald-500/10');
            el.ccmBadge.textContent = isDCM ? 'DCM — boundary exceeded' : 'CCM';
            el.dcmWarning.classList.toggle('hidden', !isDCM);
            if (isDCM) {
                el.dcmWarning.textContent = `⚠ Inductor current reaches zero before the next switching cycle — the converter has entered Discontinuous Conduction Mode. The CCM steady-state equations shown above (including the ideal Vo relation) no longer strictly hold. Increase L, increase f_sw, or reduce R to return to CCM.`;
            }

            // Component stress & efficiency grid
            const fmtPow = (w) => Math.abs(w) < 1 ? `${(w*1000).toFixed(1)} mW` : `${w.toFixed(2)} W`;
            const rippleLine = m === 'cuk'
                ? `ΔI<sub>L1</sub>=${fmtNum(dIL1)}A / ΔI<sub>L2</sub>=${fmtNum(dIL2)}A`
                : `ΔI<sub>L</sub> = ${fmtNum(dIL)} A`;
            const cards = [
                { label: 'Inductor Ripple', color: colors.ind, val: rippleLine, sub: `L = ${state.L_uH} µH` },
                { label: 'Output Ripple ΔVo', color: colors.out, val: `${fmtNum(dVo)} V`, sub: `${(Math.abs(Vo)>0 ? (dVo/Math.abs(Vo)*100).toFixed(2) : '0.00')}% of Vo` },
                { label: 'Switch Stress', color: colors.sw, val: `${fmtNum(swStat.rms)} A rms`, sub: `avg ${fmtNum(swStat.avg)}A · V_pk ${fmtNum(vBlock)}V` },
                { label: 'Diode Stress', color: colors.dio, val: `${fmtNum(dStat.rms)} A rms`, sub: `avg ${fmtNum(dStat.avg)}A · V_pk ${fmtNum(vBlock)}V` },
                { label: 'Conduction Loss', color: '#f59e0b', val: fmtPow(P_sw + P_d), sub: `sw ${fmtPow(P_sw)} · diode ${fmtPow(P_d)}` },
                { label: 'Efficiency (est.)', color: eff >= 90 ? '#10b981' : eff >= 75 ? '#f59e0b' : '#ef4444', val: `${eff.toFixed(1)} %`, sub: `P_out ${fmtPow(P_out)}` }
            ];
            el.stressGrid.innerHTML = cards.map(c => `
                <div class="bg-black/20 p-3 rounded-xl border" style="border-color:${c.color}33;">
                    <div class="text-[9.5px] font-bold uppercase tracking-wider" style="color:${c.color};">${c.label}</div>
                    <div class="mono font-bold text-[13px] mt-1" style="color:${c.color};">${c.val}</div>
                    <div class="text-[9px] text-slate-500 mono mt-0.5">${c.sub}</div>
                </div>
            `).join('');
        };

        el.sliderDuty.addEventListener('input', e => { state.duty = parseInt(e.target.value); render(); });
        el.sliderVolt.addEventListener('input', e => { state.volt = parseInt(e.target.value); render(); });

        el.sliderL.addEventListener('input', e => { state.L_uH = parseInt(e.target.value); el.valL.textContent = state.L_uH + ' µH'; render(); });
        el.sliderC.addEventListener('input', e => { state.C_uF = parseInt(e.target.value); el.valC.textContent = state.C_uF + ' µF'; render(); });
        el.sliderFsw.addEventListener('input', e => { state.fsw_kHz = parseInt(e.target.value); el.valFsw.textContent = state.fsw_kHz + ' kHz'; render(); });
        el.sliderR.addEventListener('input', e => { state.R = parseInt(e.target.value); el.valR.textContent = state.R + ' Ω'; render(); });
        el.sliderRds.addEventListener('input', e => { state.rds_mOhm = parseInt(e.target.value); el.valRds.textContent = state.rds_mOhm + ' mΩ'; render(); });
        el.sliderVf.addEventListener('input', e => { state.vf = parseFloat(e.target.value); el.valVf.textContent = state.vf.toFixed(1) + ' V'; render(); });
        
        el.zoomSlider.addEventListener('input', e => {
            state.zoom = parseInt(e.target.value);
            el.zoomLabel.innerText = state.zoom + '%';
            el.wrapper.style.width = `${state.zoom}%`;
            el.wrapper.style.minWidth = state.zoom < 100 ? '0px' : `${state.zoom * 8}px`;
        });

        // Interactive oscilloscope cursor: hover over the waveform stack to read exact
        // channel values and time at that instant, synced across every visible chart.
        el.scopeScroll.addEventListener('mousemove', (e) => {
            if (!state.lastData) return;
            const rect = el.wrapper.getBoundingClientRect();
            if (rect.width === 0) return;
            const xVB = ((e.clientX - rect.left) / rect.width) * 740;
            const deg = Math.round(xVB - 10);
            if (deg < 0 || deg > 720) {
                el.cursorLine.classList.add('hidden');
                el.readout.classList.add('hidden');
                return;
            }
            const d = state.lastData[deg];
            if (!d) return;

            el.cursorLine.classList.remove('hidden');
            el.cursorLine.style.left = e.clientX + 'px';
            el.cursorLine.style.top = rect.top + 'px';
            el.cursorLine.style.height = rect.height + 'px';

            const timeUs = state.lastTreal ? (deg * (state.lastTreal / 360) * 1e6).toFixed(2) : '0.00';
            let html = `<div class="text-slate-400 mb-1.5 pb-1.5 border-b border-white/10 flex justify-between gap-4">
                <span>t = ${timeUs} µs</span>
                <span class="${d.vg ? 'text-emerald-400' : 'text-slate-500'} font-bold">${d.vg ? 'SW ON' : 'SW OFF'}</span>
            </div>`;
            state.lastMeta.forEach(m2 => {
                const v = d[m2.key];
                if (v === undefined) return;
                html += `<div class="flex justify-between gap-4"><span style="color:${m2.color};">${m2.label}</span><span class="font-bold" style="color:${m2.color};">${fmtNum(v)}${m2.unit ? ' ' + m2.unit : ''}</span></div>`;
            });
            el.readout.innerHTML = html;
            el.readout.classList.remove('hidden');

            let rx = e.clientX + 18;
            const maxX = window.innerWidth - 190;
            if (rx > maxX) rx = e.clientX - 190;
            el.readout.style.left = rx + 'px';
            el.readout.style.top = rect.top + 8 + 'px';
        });
        el.scopeScroll.addEventListener('mouseleave', () => {
            el.cursorLine.classList.add('hidden');
            el.readout.classList.add('hidden');
        });

        // Initialize
        render();
    </script>
</body>
</html>
